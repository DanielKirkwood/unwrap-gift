# Local development config for self-hosted Ory Kratos. Started via
# `task kratos:up` (see Taskfile.yml / docker-compose.kratos.yml).
#
# Not used in production: see README.md in this directory for what changes
# (secrets, cookie domain, courier SMTP, no --dev flag) when deploying for
# real.

version: v1.3.0

dsn: ${DSN}

serve:
  public:
    base_url: http://127.0.0.1:4433/
    cors:
      enabled: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  # app.* (Phase 8's web router, port 8083) replaces the old
  # kratos-selfservice-ui-node reference UI (removed from
  # docker-compose.kratos.yml) — login now drives this Kratos browser flow
  # directly from our own /login page instead of a separate service.
  default_browser_return_url: http://127.0.0.1:8083/wishlist
  allowed_return_urls:
    - http://127.0.0.1:8083
    # Browsers treat 127.0.0.1 and localhost as different hosts, so both
    # need allow-listing here for local dev to tolerate either — the app
    # itself is host-agnostic (it builds return_to from the incoming
    # request's own Host header), this is purely a Kratos-side allow-list.
    - http://localhost:8083

  methods:
    # Kratos enables the password method by default even though it's never
    # configured "on" anywhere in this file — confirmed empirically: a
    # /self-service/login flow rendered both a code form AND a password
    # form (with no password ever set on any identity, since
    # identity.schema.json has no password-eligible trait) until this was
    # added. This app is SMS-code-only; password must be off explicitly.
    password:
      enabled: false
    code:
      passwordless_enabled: true

  flows:
    # error/settings/registration below are inert placeholders, not real
    # pages — nothing in this app triggers them (no registration UI since
    # identities are organiser-provisioned only; no settings UI; errors are
    # handled by internal/web's own error.html). Pointed at the web app's
    # root rather than left dangling at the removed :4455 service.
    error:
      ui_url: http://127.0.0.1:8083/

    settings:
      ui_url: http://127.0.0.1:8083/
      privileged_session_max_age: 15m

    # Disabled outright rather than left configured-but-dead: neither
    # applies to a passwordless-SMS-only, organiser-provisioned identity
    # model (no password to recover, no email to verify).
    recovery:
      enabled: false

    verification:
      enabled: false

    logout:
      after:
        default_browser_return_url: http://127.0.0.1:8083/login

    login:
      ui_url: http://127.0.0.1:8083/login

    registration:
      ui_url: http://127.0.0.1:8083/
      after:
        password:
          hooks:
            - hook: session

log:
  level: debug
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-NOT-SECURE-DEV-ONLY
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

# Kratos's outbound HTTP client blocks requests to private/internal IP
# ranges by default — an SSRF hardening default. Our own courier webhook is
# deliberately an internal target (a container-network hostname in
# production, host.docker.internal in dev), so that default is relaxed for
# this self-hosted, single-tenant deployment. NOTE: this alone does not
# cover courier.channels' own outbound guard (see the GOTCHA on the `sms`
# channel below) — it only affects clients.http's general-purpose client.
clients:
  http:
    disallow_private_ip_ranges: false

courier:
  smtp:
    # oryd/mailslurper:latest-smtps listens on 1025 with *implicit* TLS
    # (confirmed via its own startup log: "SMTP listener running on SSL
    # 0.0.0.0:1025") — smtps://, not smtp://, and skip_ssl_verify since it
    # uses a self-signed dev cert. Kept even though no email templates are
    # sent anymore — the courier worker may require a valid SMTP config to
    # start at all (see deploy/kratos/README.md).
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
  # GOTCHA (discovered empirically — see this plan's Task 10 e2e spike):
  # `courier.sms.request_config` (the shape External Documentation's Ory
  # self-hosted doc page shows) is accepted by schema validation but never
  # actually dispatches on this Kratos version — no request is ever sent,
  # no error is logged even at trace level, and the message just sits
  # "abandoned" after retries. `courier.channels` (an array, `type: http`)
  # is the shape that actually works for self-hosted Kratos v1.3.x — this
  # is the format Ory's own SMS setup guide uses, not the "self-hosted"
  # page's request_config example.
  channels:
    - id: sms
      type: http
      request_config:
        url: http://host.docker.internal:8082/webhooks/kratos/sms
        method: POST
        body: file:///etc/config/kratos/login_code.sms.jsonnet
        headers:
          Content-Type: application/json
        auth:
          type: api_key
          config:
            name: X-Courier-Webhook-Secret
            value: dev-courier-webhook-secret-not-secure
            in: header
  templates:
    login_code:
      valid:
        sms:
          body:
            plaintext: "base64://WW91ciBTZWNyZXQgU2FudGEgbG9naW4gY29kZSBpczoge3sgLkxvZ2luQ29kZSB9fQ=="
        # Kratos's own config schema requires a login_code.valid.email
        # template even though this identity schema has no email trait and
        # the code method here is SMS-only (via: sms). This is never
        # rendered or sent — no identity ever has an email address to send
        # it to — but the config fails schema validation without it.
        email:
          subject: "base64://WW91ciBTZWNyZXQgU2FudGEgbG9naW4gY29kZQ=="
          body:
            plaintext: "base64://WW91ciBTZWNyZXQgU2FudGEgbG9naW4gY29kZSBpczoge3sgLkxvZ2luQ29kZSB9fQ=="
            html: "base64://WW91ciBTZWNyZXQgU2FudGEgbG9naW4gY29kZSBpczoge3sgLkxvZ2luQ29kZSB9fQ=="
