# Local development config for self-hosted Ory Kratos. Started via
# `task kratos:up` (see Taskfile.yml / docker-compose.kratos.yml).
#
# Not used in production: see README.md in this directory for what changes
# (secrets, cookie domain, courier SMTP, no --dev flag) when deploying for
# real.

version: v1.3.0

dsn: ${DSN}

serve:
  public:
    base_url: http://127.0.0.1:4433/
    cors:
      enabled: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:4455/
  allowed_return_urls:
    - http://127.0.0.1:4455

  methods:
    password:
      enabled: true

  flows:
    error:
      ui_url: http://127.0.0.1:4455/error

    settings:
      ui_url: http://127.0.0.1:4455/settings
      privileged_session_max_age: 15m

    recovery:
      enabled: true
      ui_url: http://127.0.0.1:4455/recovery

    verification:
      enabled: true
      ui_url: http://127.0.0.1:4455/verification
      after:
        default_browser_return_url: http://127.0.0.1:4455/

    logout:
      after:
        default_browser_return_url: http://127.0.0.1:4455/login

    login:
      ui_url: http://127.0.0.1:4455/login

    registration:
      ui_url: http://127.0.0.1:4455/registration
      after:
        password:
          hooks:
            - hook: session

log:
  level: debug
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-NOT-SECURE-DEV-ONLY
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    # oryd/mailslurper:latest-smtps listens on 1025 with *implicit* TLS
    # (confirmed via its own startup log: "SMTP listener running on SSL
    # 0.0.0.0:1025") — smtps://, not smtp://, and skip_ssl_verify since it
    # uses a self-signed dev cert.
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
