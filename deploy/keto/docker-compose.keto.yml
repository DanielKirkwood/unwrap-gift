# Local development Ory Keto stack. Not used in production — see
# README.md in this directory. Started/stopped via the Taskfile's
# keto:up/keto:down targets, which run:
#
#   docker compose -f deploy/keto/docker-compose.keto.yml up/down
#
# unwrap-gift itself runs on the host (task run), not inside this compose
# network, so KETO_READ_URL/KETO_WRITE_URL in .env point at
# localhost:4466/4467.

name: unwrap-gift-keto

services:
  postgres-keto:
    image: postgres:17
    environment:
      POSTGRES_USER: keto
      POSTGRES_PASSWORD: keto
      POSTGRES_DB: keto
    ports:
      - "5434:5432"
    volumes:
      - keto-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keto"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - keto

  keto-migrate:
    image: oryd/keto:v26.2.0
    depends_on:
      postgres-keto:
        condition: service_healthy
    environment:
      DSN: postgres://keto:keto@postgres-keto:5432/keto?sslmode=disable&max_conns=20&max_idle_conns=4
    volumes:
      - ./keto.yml:/etc/config/keto/keto.yml
      - ./identities.ts:/etc/config/keto/identities.ts
    command: -c /etc/config/keto/keto.yml migrate up -y
    networks:
      - keto

  keto:
    image: oryd/keto:v26.2.0
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://keto:keto@postgres-keto:5432/keto?sslmode=disable&max_conns=20&max_idle_conns=4
    ports:
      - "4466:4466" # read API — matches KETO_READ_URL in .env
      - "4467:4467" # write API — matches KETO_WRITE_URL in .env
    volumes:
      - ./keto.yml:/etc/config/keto/keto.yml
      - ./identities.ts:/etc/config/keto/identities.ts
    command: serve -c /etc/config/keto/keto.yml
    networks:
      - keto

networks:
  keto:
    driver: bridge

volumes:
  keto-postgres-data:
