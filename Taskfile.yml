# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
    EXE: bin/unwrap-gift{{exeExt}}
    DEV_DB_PATH: dev.db

tasks:
    default:
        desc: "Build and run the app on the host (no auth backends; see task dev:up for the full stack)"
        aliases: [run]
        dotenv: [".env"]
        cmds:
            - task: build
            - ./{{.EXE}} {{.CLI_ARGS | default "start"}}

    build:
        desc: Builds the app
        cmds:
            - go build -v -o {{.EXE}}
        generates:
            - "{{.EXE}}"

    test:
        desc: Runs the test suite
        cmds:
            - go test ./...

    test:e2e:
        desc: Runs e2e tests (needs Docker; spins up its own Postgres/Kratos/mailslurper containers)
        cmds:
            - go test -tags=e2e ./...

    fmt:
        desc: Formats the code
        cmds:
            - golangci-lint fmt

    lint:
        desc: Lints the code
        cmds:
            - golangci-lint run

    db:migrate:
        desc: Apply all pending database migrations
        deps: [build]
        dotenv: [".env"]
        env:
            DATABASE_PATH: "{{.DEV_DB_PATH}}"
        cmds:
            - ./{{.EXE}} db migrate --dev

    db:rollback:
        desc: Roll back the most recent database migration
        deps: [build]
        dotenv: [".env"]
        env:
            DATABASE_PATH: "{{.DEV_DB_PATH}}"
        cmds:
            - ./{{.EXE}} db rollback --dev

    db:create:
        desc: "Create a new migration file (usage: task db:create -- add_widgets)"
        deps: [build]
        cmds:
            - ./{{.EXE}} db create {{.CLI_ARGS}}

    db:status:
        desc: Show which migrations are applied vs pending
        deps: [build]
        dotenv: [".env"]
        env:
            DATABASE_PATH: "{{.DEV_DB_PATH}}"
        cmds:
            - ./{{.EXE}} db status --dev

    db:seed:
        desc: Seed the database with development data
        deps: [build]
        dotenv: [".env"]
        env:
            DATABASE_PATH: "{{.DEV_DB_PATH}}"
        cmds:
            - ./{{.EXE}} db seed --dev

    db:reset:
        desc: Drop the local dev SQLite file and re-run migrations from scratch
        cmds:
            - rm -f {{.DEV_DB_PATH}} {{.DEV_DB_PATH}}-wal {{.DEV_DB_PATH}}-shm
            - task: db:migrate

    sqlc:generate:
        desc: Regenerate sqlc code from schema + queries
        cmds:
            - sqlc generate

    sqlc:vet:
        desc: Lint SQL queries against the live schema
        cmds:
            - sqlc vet

    sqlc:check:
        desc: Fail if committed generated code is stale (CI drift check)
        cmds:
            - sqlc generate
            - git diff --exit-code internal/db/sqlc

    kratos:up:
        desc: Start the local dev Ory Kratos stack (Postgres, Kratos, self-service UI, mailslurper)
        cmds:
            - docker compose -f deploy/kratos/docker-compose.kratos.yml up --wait

    kratos:down:
        desc: Stop the local dev Ory Kratos stack
        cmds:
            - docker compose -f deploy/kratos/docker-compose.kratos.yml down

    kratos:logs:
        desc: Tail logs from the local dev Ory Kratos stack
        cmds:
            - docker compose -f deploy/kratos/docker-compose.kratos.yml logs -f

    keto:up:
        desc: Start the local dev Ory Keto stack (Postgres, Keto)
        cmds:
            - docker compose -f deploy/keto/docker-compose.keto.yml up --wait

    keto:down:
        desc: Stop the local dev Ory Keto stack
        cmds:
            - docker compose -f deploy/keto/docker-compose.keto.yml down

    keto:logs:
        desc: Tail logs from the local dev Ory Keto stack
        cmds:
            - docker compose -f deploy/keto/docker-compose.keto.yml logs -f

    auth:up:
        desc: Start the full local dev auth stack (Kratos + Keto)
        cmds:
            - task: kratos:up
            - task: keto:up

    auth:down:
        desc: Stop the full local dev auth stack (Kratos + Keto)
        cmds:
            - task: keto:down
            - task: kratos:down

    dev:up:
        desc: "Start the full local dev stack in Docker — Kratos, Keto, mailslurper, and unwrap-gift itself with hot reload (see deploy/dev/docker-compose.yml)"
        cmds:
            - docker compose --env-file .env -f deploy/dev/docker-compose.yml up --build --wait

    dev:down:
        desc: Stop the full local dev stack started via dev:up
        cmds:
            - docker compose --env-file .env -f deploy/dev/docker-compose.yml down

    dev:logs:
        desc: Tail logs from the full local dev stack
        cmds:
            - docker compose --env-file .env -f deploy/dev/docker-compose.yml logs -f

    dev:seed:
        desc: Seed Keto admin relation tuples inside the running dev stack (needs KETO_SEED_ADMIN_IDENTITY_ID in .env)
        cmds:
            - docker compose --env-file .env -f deploy/dev/docker-compose.yml exec unwrap-gift go run . db seed

    dev:exec:
        desc: "Run an unwrap-gift CLI command inside the running dev stack (usage: task dev:exec -- task exec grant-admin --arg identity-id=<id>)"
        cmds:
            - docker compose --env-file .env -f deploy/dev/docker-compose.yml exec unwrap-gift go run . {{.CLI_ARGS}}

    clean:
        desc: Clean every generated file
        cmds:
            - rm -f {{.EXE}}
