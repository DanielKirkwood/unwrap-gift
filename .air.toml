# air config for deploy/dev/docker-compose.yml's hot-reloading unwrap-gift
# service (see deploy/dev/Dockerfile). Not used by `task run`/`task build` —
# those build the real binary directly, no watcher involved.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ."
bin = "./tmp/main"
full_bin = "./tmp/main start"
include_ext = ["go"]
exclude_dir = ["tmp", "bin", "deploy", ".git", ".claude"]
delay = 200
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
