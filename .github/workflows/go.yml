# This workflow lints, tests, and builds a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup Go 1.27.1
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./... -race -cover

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup Go 1.27.1
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Install dependencies
      run: go get .

    - name: Build
      run: go build -o ./out/service -ldflags="-w -s" .

  sqlc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup Go 1.27.1
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Install sqlc
      uses: sqlc-dev/setup-sqlc@v5
      with:
        sqlc-version: '1.27.0'

    - name: Check generated code is up to date
      run: |
        sqlc generate
        git diff --exit-code internal/db/sqlc

    - name: Vet queries
      run: sqlc vet

  docker:
    runs-on: ubuntu-latest
    needs: [test, build, sqlc]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # full history, so `git describe` below finds a tag

    - name: Determine image version and repo (GHCR requires lowercase)
      id: version
      run: |
        echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
        echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
        tags: |
          ghcr.io/${{ steps.version.outputs.repo }}:latest
          ghcr.io/${{ steps.version.outputs.repo }}:${{ steps.version.outputs.version }}
